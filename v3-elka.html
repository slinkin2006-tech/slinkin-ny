<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ёлка Василия Слинкина</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yeseva+One&family=Onest:wght@400;500;700&display=swap">
<style>
/* Layout: ночная ёлка. Каждый шар — игра, звезда — ведущий. Слева ёлка, справа карточка выбранного шара. Единый мир: зимняя ночь, хвоя, тёплое золото гирлянды. */
:root{
  --night:#0a1624; --night-2:#10233a; --pine:#16523d; --pine-2:#0f3c2d; --gold:#f3c56b; --warm:#ffd88a; --frost:#e9f2f6; --muted:#a9bccb; --berry:#e2474b;
  --display:'Yeseva One', Georgia, serif;
  --body:'Onest', 'Segoe UI', system-ui, sans-serif;
  color-scheme: dark;
}
html{background:var(--night)}
body{background:radial-gradient(1200px 600px at 30% -10%, #1b3656 0%, var(--night) 60%) fixed, var(--night);color:var(--frost);font-family:var(--body);font-size:16px;line-height:1.55;min-height:100%}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:28px 40px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
[hidden]{display:none!important}
.label{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:500}

header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
header h1{font-size:clamp(34px,5.6vw,64px)}
header h1 span{color:var(--gold)}
header .sub{color:var(--muted);max-width:44ch;margin-top:10px}
.switch{display:inline-flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border:1px solid rgba(243,197,107,.35);color:var(--frost);border-radius:999px;padding:8px 16px 8px 8px;font:inherit;font-weight:500;cursor:pointer}
.switch .k{width:44px;height:26px;border-radius:999px;background:#2a3b4d;position:relative;transition:background .3s}
.switch .k::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--frost);transition:transform .3s}
.switch[aria-pressed="true"] .k{background:var(--gold)}
.switch[aria-pressed="true"] .k::after{transform:translateX(18px)}
.switch:focus-visible,.orn:focus-visible,.star:focus-visible,.btn:focus-visible{outline:3px solid var(--warm);outline-offset:3px}

.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,4vw,52px);align-items:start;margin-top:26px}
.tree{position:relative;width:100%;max-width:520px;margin:0 auto;aspect-ratio:400/520}
.tree svg{position:absolute;inset:0;width:100%;height:100%}
.orn{position:absolute;width:17%;aspect-ratio:1/1;transform:translate(-50%,-50%);border-radius:50%;border:0;padding:0;cursor:pointer;background:var(--night-2);
  box-shadow:0 0 0 3px var(--gold),0 10px 18px -6px rgba(0,0,0,.7);transition:transform .35s cubic-bezier(.3,1.6,.5,1),box-shadow .3s;overflow:visible;max-width:100%}
.orn img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.orn::before{content:"";position:absolute;left:50%;top:-11%;width:22%;height:14%;transform:translateX(-50%);background:linear-gradient(var(--warm),#b88a33);border-radius:3px 3px 1px 1px}
.orn::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.55) 0 8%, transparent 26%);pointer-events:none}
.orn:hover{transform:translate(-50%,-50%) scale(1.12) rotate(-4deg)}
.orn.active{box-shadow:0 0 0 4px var(--warm),0 0 26px 6px rgba(255,216,138,.55)}
.orn .tip{position:absolute;left:50%;top:104%;transform:translateX(-50%);white-space:nowrap;font-size:11px;font-weight:500;background:rgba(10,22,36,.85);padding:2px 8px;border-radius:999px;color:var(--frost);pointer-events:none;opacity:0;transition:opacity .2s}
.orn:hover .tip,.orn:focus-visible .tip{opacity:1}
.star{position:absolute;left:50%;top:5.2%;width:16%;aspect-ratio:1/1;transform:translate(-50%,-50%);border:0;background:none;cursor:pointer;padding:0}
.star svg{width:100%;height:100%;filter:drop-shadow(0 0 10px rgba(255,216,138,.7));transition:transform .4s}
.star:hover svg{transform:rotate(18deg) scale(1.08)}
.bulb{fill:#55606b;transition:fill .3s}
.lit .bulb{animation:blink 1.4s infinite}
.lit .bulb:nth-child(3n){animation-delay:.45s}
.lit .bulb:nth-child(3n+1){animation-delay:.9s}
@keyframes blink{0%,100%{fill:#ffd88a;filter:drop-shadow(0 0 4px #ffd88a)}33%{fill:#e2474b}66%{fill:#8fd6ff}}
.hint{text-align:center;color:var(--muted);font-size:14px;margin-top:6px}

.card{background:linear-gradient(180deg, rgba(22,82,61,.35), rgba(16,35,58,.6));border:1px solid rgba(243,197,107,.28);border-radius:24px;overflow:hidden;position:sticky;top:calc(16px + env(safe-area-inset-top, 0px))}
.card .img{aspect-ratio:16/10;width:100%;object-fit:cover;display:block;background:var(--night-2)}
.card .body{padding:22px 24px 24px;display:grid;gap:12px}
.card h2{font-size:clamp(26px,3vw,36px)}
.card .hook{font-size:18px;color:var(--warm)}
.card .text{color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tags span{font-size:13px;padding:5px 11px;border-radius:999px;border:1px solid rgba(233,242,246,.25);color:var(--frost)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.btn{appearance:none;border:0;cursor:pointer;font:inherit;font-weight:700;font-size:14px;padding:11px 18px;border-radius:999px;background:var(--gold);color:var(--night)}
.btn.ghost{background:transparent;color:var(--frost);border:1px solid rgba(233,242,246,.35)}
.progress{display:flex;gap:5px;margin-top:2px}
.progress i{flex:1;height:3px;border-radius:2px;background:rgba(233,242,246,.15)}
.progress i.on{background:var(--gold)}

.about{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(20px,4vw,48px);align-items:center;margin-top:80px}
.about img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:50% 20%;border-radius:999px 999px 24px 24px;display:block;max-width:100%}
.about h2{font-size:clamp(28px,4vw,46px);margin-top:10px}
.about p{margin-top:14px;color:var(--muted);max-width:58ch}
.about .big{color:var(--frost);font-size:19px}
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:64px}
.steps div{border-top:2px solid var(--gold);padding-top:14px}
.steps b{font-family:var(--display);font-size:22px;font-weight:400;display:block;margin-bottom:6px}
.steps p{color:var(--muted)}
.cta{margin-top:72px;text-align:center;display:grid;gap:16px;justify-items:center}
.cta h2{font-size:clamp(30px,5vw,56px)}
.cta p{color:var(--muted);max-width:52ch}
.contacts{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.contact{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.06);border:1px solid rgba(243,197,107,.3);border-radius:16px;padding:10px 10px 10px 16px}
.contact small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.contact span{font-weight:700;font-size:17px;user-select:all;word-break:break-all}
footer{margin-top:48px;text-align:center;color:var(--muted);font-size:13px}

@media (max-width:880px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .card{position:static}
  .about{grid-template-columns:minmax(0,1fr)}
  .about img{max-width:340px;margin:0 auto}
  .steps{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>


<canvas id="snow" aria-hidden="true"></canvas>
<div class="wrap">
  <header>
    <div>
      <div class="label">Василий Слинкин · ведущий</div>
      <h1 style="margin-top:10px">Нарядим <span>ваш праздник</span></h1>
      <p class="sub">Девять шаров — девять игр на Новый год. Звезда наверху — ведущий. Нажмите на любой шар.</p>
    </div>
    <button class="switch" id="lights" aria-pressed="false"><span class="k"></span>Зажечь гирлянду</button>
  </header>

  <div class="stage">
    <div>
      <div class="tree" id="tree">
        <svg viewBox="0 0 400 520" aria-hidden="true">
          <defs>
            <linearGradient id="pg" x1="0" x2="1"><stop offset="0" stop-color="#0f3c2d"/><stop offset=".55" stop-color="#16523d"/><stop offset="1" stop-color="#0c3126"/></linearGradient>
          </defs>
          <rect x="182" y="462" width="36" height="46" rx="4" fill="#5b3a22"/>
          <path d="M200 44 L310 210 L90 210 Z" fill="url(#pg)"/>
          <path d="M200 120 L350 340 L50 340 Z" fill="url(#pg)"/>
          <path d="M200 230 L392 474 L8 474 Z" fill="url(#pg)"/>
          <path d="M70 330 Q200 300 330 330 M40 466 Q200 410 362 466 M112 202 Q200 180 290 202" stroke="#0a2a20" stroke-width="3" fill="none" opacity=".6"/>
          <g id="garland" fill="none">
            <path d="M120 190 Q200 220 285 185" stroke="#c9a14f" stroke-width="1.5"/>
            <path d="M80 315 Q200 360 325 305" stroke="#c9a14f" stroke-width="1.5"/>
            <path d="M40 455 Q200 500 365 440" stroke="#c9a14f" stroke-width="1.5"/>
          </g>
          <g id="bulbs"></g>
        </svg>
        <button class="star" id="star" aria-label="Ведущий Василий Слинкин">
          <svg viewBox="0 0 100 100"><path d="M50 4l12.4 29.8 32.2 2.6-24.5 21 7.5 31.4L50 72 22.4 88.8l7.5-31.4-24.5-21 32.2-2.6z" fill="#f3c56b" stroke="#fff3cf" stroke-width="2"/></svg>
        </button>
      </div>
      <p class="hint">Наведите на шар, чтобы прочитать название</p>
    </div>
    <article class="card" id="card" aria-live="polite"></article>
  </div>

  <section class="about">
    <img src="v_mic.jpg" alt="Василий Слинкин с микрофоном на фоне шаров">
    <div>
      <div class="label">Кто под звездой</div>
      <h2>Василий Слинкин</h2>
      <p class="big" id="salad"></p>
      <p id="about"></p>
      <p id="guests"></p>
    </div>
  </section>

  <section class="steps" id="steps"></section>

  <section class="cta">
    <div class="label">Последний шар</div>
    <h2>Повесим его у вас?</h2>
    <p id="dec"></p>
    <div class="contacts" id="contacts"></div>
  </section>
  <footer id="horse"></footer>
</div>

<script src="data.js"></script>
<script>
(function(){
  var V = window.VS;
  document.getElementById('salad').textContent = V.lines.salad;
  document.getElementById('about').textContent = V.about;
  document.getElementById('guests').textContent = V.lines.guests;
  document.getElementById('dec').textContent = V.lines.december;
  document.getElementById('horse').textContent = V.lines.horse;
  document.getElementById('steps').innerHTML = V.steps.map(function(s,i){ return '<div><span class="label">Шаг '+(i+1)+'</span><b>'+s.t+'</b><p>'+s.d+'</p></div>'; }).join('');
  document.getElementById('contacts').innerHTML =
    '<div class="contact"><div><small>Телефон</small><span>'+V.contact.phone+'</span></div><button class="btn" data-copy="'+V.contact.phone+'">Копировать</button></div>'+
    '<div class="contact"><div><small>Telegram</small><span>'+V.contact.tg+'</span></div><button class="btn" data-copy="'+V.contact.tg+'">Копировать</button></div>';
  document.getElementById('contacts').addEventListener('click', function(e){ var c=e.target.closest('[data-copy]'); if(c) V.copy(c.getAttribute('data-copy'), c); });

  // ornaments: positions in viewBox units (400x520)
  var pos = [[200,158],[150,262],[256,252],[112,352],[204,372],[292,348],[86,440],[196,448],[306,432]];
  var order = ['quiz','neuro','spoil','intu','s100','hypno','rifmo','koza','chbd'];
  var tree = document.getElementById('tree');
  order.forEach(function(id,i){
    var g = V.byId(id), b = document.createElement('button');
    b.className='orn'; b.setAttribute('data-id', id); b.setAttribute('aria-label', g.title);
    b.style.left = (pos[i][0]/400*100)+'%'; b.style.top = (pos[i][1]/520*100)+'%';
    b.innerHTML = '<img src="'+g.img+'" alt="">'+'<span class="tip">'+g.title+'</span>';
    tree.appendChild(b);
  });
  // bulbs along garland
  var bulbs = document.getElementById('bulbs'), paths = document.querySelectorAll('#garland path'), ns='http://www.w3.org/2000/svg';
  paths.forEach(function(p){ var L=p.getTotalLength(); for(var t=0;t<=1.001;t+=1/9){ var pt=p.getPointAtLength(L*t); var c=document.createElementNS(ns,'circle'); c.setAttribute('cx',pt.x); c.setAttribute('cy',pt.y+3); c.setAttribute('r',4.2); c.setAttribute('class','bulb'); bulbs.appendChild(c);} });

  var card = document.getElementById('card'), seen = {};
  function prog(){ return '<div class="progress">'+order.map(function(id){ return '<i class="'+(seen[id]?'on':'')+'"></i>'; }).join('')+'</div>'; }
  function show(id){
    tree.querySelectorAll('.orn').forEach(function(o){ o.classList.toggle('active', o.getAttribute('data-id')===id); });
    if (id==='host'){
      card.innerHTML = '<img class="img" src="v_horse.jpg" alt="Василий Слинкин на лошадке у ёлки" style="object-position:50% 30%"><div class="body"><span class="label">Звезда ёлки</span><h2>Василий Слинкин</h2><p class="hook">'+V.lines.talk+'</p><p class="text">Ведущий новогодних праздников. Девять игр ниже — его программа на этот Новый год. Выбирайте шар.</p><div class="row"><button class="btn" data-go="quiz">Начать с первого шара</button></div></div>';
      return;
    }
    seen[id]=1;
    var g = V.byId(id), i = order.indexOf(id), next = order[(i+1)%order.length];
    card.innerHTML = '<img class="img" src="'+g.img+'" alt="'+g.title+'"><div class="body"><span class="label">Шар '+(i+1)+' из 9 · '+g.kind+'</span><h2>'+g.title+'</h2><p class="hook">'+g.hook+'</p><p class="text">'+g.text+'</p><div class="tags">'+g.tags.map(function(t){return '<span>'+t+'</span>';}).join('')+'</div>'+prog()+'<div class="row"><button class="btn" data-go="'+next+'">Следующий шар</button><button class="btn ghost" data-go="host">К звезде</button></div></div>';
  }
  tree.addEventListener('click', function(e){ var o=e.target.closest('.orn'); if(o){ show(o.getAttribute('data-id')); if (window.innerWidth<880) card.scrollIntoView({behavior:'smooth',block:'start'}); } });
  document.getElementById('star').addEventListener('click', function(){ show('host'); });
  card.addEventListener('click', function(e){ var b=e.target.closest('[data-go]'); if(b) show(b.getAttribute('data-go')); });
  show('host');

  var lights = document.getElementById('lights');
  lights.addEventListener('click', function(){ var on = tree.classList.toggle('lit'); lights.setAttribute('aria-pressed', on); lights.lastChild.textContent = on ? 'Гирлянда горит' : 'Зажечь гирлянду'; });

  // snow
  var cv = document.getElementById('snow'), ctx = cv.getContext('2d'), flakes = [], W, H;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ W = cv.width = innerWidth; H = cv.height = innerHeight; }
  size(); addEventListener('resize', size);
  for (var i=0;i<90;i++) flakes.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+.6,s:Math.random()*.6+.25,d:Math.random()*Math.PI*2});
  function tick(){
    ctx.clearRect(0,0,W,H); ctx.fillStyle='rgba(233,242,246,.75)';
    flakes.forEach(function(f){ f.y+=f.s; f.d+=.01; f.x+=Math.sin(f.d)*.3; if(f.y>H){f.y=-4;f.x=Math.random()*W;} ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,6.3); ctx.fill(); });
    if(!reduce) requestAnimationFrame(tick);
  }
  tick();
})();
</script>

</body>
</html>
